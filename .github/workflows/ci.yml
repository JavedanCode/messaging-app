name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint, format, and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: express_auth_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d express_auth_api_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/express_auth_api_test
      CLIENT_URL: http://localhost:5173
      JWT_ACCESS_SECRET: ci-test-access-secret-123456789012345678901234
      JWT_REFRESH_SECRET: ci-test-refresh-secret-123456789012345678901234
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      RESEND_API_KEY: re_test_placeholder
      EMAIL_FROM: test@example.com
      PASSWORD_RESET_URL: http://localhost:5173/reset-password
      EMAIL_CHANGE_URL: http://localhost:5173/change-email

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Run checks
        run: npm run check
